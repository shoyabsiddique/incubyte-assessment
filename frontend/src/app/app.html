<mat-toolbar class="toolbar">
  @if (narrow() && auth.isAuthenticated()) {
    <button
      mat-icon-button
      class="menu-toggle"
      type="button"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <h1 class="app-title">{{ title }}</h1>
  <span class="spacer"></span>
  @if (auth.user(); as user) {
    <span class="user">{{ user.email }}</span>
    <button class="sign-out" mat-button type="button" (click)="signOut()">Sign out</button>
  }
</mat-toolbar>

<mat-sidenav-container class="layout">
  @if (auth.isAuthenticated()) {
    <mat-sidenav
      class="sidenav"
      [mode]="narrow() ? 'over' : 'side'"
      [opened]="narrow() ? menuOpen() : true"
      (closedStart)="closeMenu()"
    >
      <nav aria-label="Main navigation">
        <mat-nav-list>
          @for (item of navItems; track item.path) {
            <a
              mat-list-item
              [routerLink]="item.path"
              routerLinkActive
              ariaCurrentWhenActive="page"
              #link="routerLinkActive"
              [activated]="link.isActive"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          }
        </mat-nav-list>
      </nav>
    </mat-sidenav>
  }

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
