name: CI

# Runs on every push and pull request. Any failing job fails the run.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs of a branch are cancelled, but a run on main always finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run fast tests (no Docker needed)
        run: ./gradlew test --no-daemon

  backend-integration:
    name: Backend integration tests (Testcontainers MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run integration tests (Docker is preinstalled on the runner)
        run: ./gradlew integrationTest --no-daemon

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build

  e2e:
    name: End-to-end smoke test (real stack, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: salary
          MARIADB_USER: salary
          MARIADB_PASSWORD: salary
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: jdbc:mariadb://localhost:3306/salary
      DB_USER: salary
      DB_PASSWORD: salary
      SPRING_PROFILES_ACTIVE: local,seed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Start the API with the seeded demo data
        working-directory: backend
        run: nohup ./gradlew bootRun --no-daemon > ../api.log 2>&1 &
      - name: Start the UI
        working-directory: frontend
        run: |
          npm ci
          nohup npm start > ../ui.log 2>&1 &
      - name: Wait for the API and the UI
        run: |
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/actuator/health
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4200 >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://localhost:4200 >/dev/null
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke test
        working-directory: e2e
        run: npm test
      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-logs
          path: |
            api.log
            ui.log
            e2e/test-results
