# Local development against a MariaDB started with Docker. Override with environment variables.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/salary}
spring.datasource.username=${DB_USER:salary}
spring.datasource.password=${DB_PASSWORD:salary}

# Development-only values. Never reuse them anywhere else.
# With no JWT_SECRET a fresh random key is generated at every start, so no signing key is committed
# (restarting the backend signs everyone out, which is fine for local development).
app.security.jwt-secret=${JWT_SECRET:${random.uuid}${random.uuid}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.seed.hr-password=${DEMO_HR_PASSWORD:LocalDemo#2026}
