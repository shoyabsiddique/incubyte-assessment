# Production: every setting must come from the environment, with no defaults, so a missing value
# stops the application from starting instead of running with something unintended.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# At least 32 bytes, otherwise the application refuses to start.
app.security.jwt-secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
