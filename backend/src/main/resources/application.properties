spring.application.name=salary

# The schema is owned by Flyway; Hibernate only checks that the entities match it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Shared MySQL hosting limits connections per user, so keep the pool small.
spring.datasource.hikari.maximum-pool-size=5

# Only health and info are exposed, and health never reveals details to callers.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# One JSON object per log line; the correlation ID is added from the logging context.
logging.structured.format.console=logstash
